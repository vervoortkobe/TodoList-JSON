<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${req.session.username} • Todo List</title>
  <link id="favicon" rel="icon" href="${req.session.avatar}">
  <link href="./reset.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/halfmoon@1.1.1/css/halfmoon-variables.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/halfmoon@1.1.1/js/halfmoon.min.js" defer></script>
  <link href="./todo.css" rel="stylesheet" />
  <script src="./todo.js" defer></script>
</head>
<body id="body"${theme}>
  <div id="preload" class="preload">
    <div class="lds-dual-ring"></div>
  </div>

  <div id="pagecontent" class="pagecontent page-wrapper with-navbar">
    <nav id="navbar" class="navbar">
      <div class="navbar-content">
        <button onclick="toggleTheme()" id="theme" class="theme btn btn-action hidden md:block rounded-md p-2 hover:bg-discord-blurple-630 focus:outline-none focus:ring-1 focus:ring-inset focus:ring-white" aria-label="Switch to light theme" type="button">
          <svg preserveAspectRatio="xMidYMid meet" viewBox="0 0 24 24" width="1.2em" height="1.2em" class="fill-current text-gray-200 hover:text-white h-6 w-6" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 0 1 8.646 3.646A9.003 9.003 0 0 0 12 21a9.003 9.003 0 0 0 8.354-5.646Z"></path>
          </svg>
        </button>

        <b>
          <a class="navavatar">
            <img src="${req.session.avatar}" alt="avatar" id="avatar" class="avatar">
          </a>
          <a class="navbar-brand">
            <b>${req.session.username}</b>
          </a>
        </b>
        
        <a class="navbar-brand">
          <form action="logout" method="POST">
            <input type="submit" value="Log out!" class="btn btn-danger">
          </form>
        </a>
      </div>
    </nav>
    
    <h1>Todo List</h1>
    <div class="grid" id="grid">
      <form action="add" method="POST">
        <label for="name" class="required forname" id="forname">Name</label><label for="date" class="fordate required" id="fordate">Until date</label>
				<input type="text" name="name" placeholder="Short name for your new Todo..." id="name" class="form-control" autofocus required><input type="date" name="date" id="date" class="form-control" required>
        <label for="description" class="fordescription required" id="fordescription">Description</label>
				<textarea type="text" name="description" placeholder="Describe your new Todo..." id="description" class="form-control" required></textarea>
				<input type="submit" id="submit" class="btn btn-success" value="Add this new Todo to my list!">
      </form>
      
      <br><br><br><div id="vr" class="vr"></div>
      
      <div id="todolist" class="todolist">${htmlTodos}</div>
    </div>
  </div>
</body>
</html>
